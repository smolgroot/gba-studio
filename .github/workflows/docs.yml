name: Docs

# Build and publish the VitePress documentation when a version tag is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer tag replaces an older one in the queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # VitePress "last updated" dates come from git history

      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @pecten-studio/docs

      # GitHub Pages serves the site under the repository's name.
      - run: pnpm --filter @pecten-studio/docs build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
