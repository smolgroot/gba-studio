name: Release

# Build the desktop app and publish it as a GitHub Release when a version tag is pushed.
# v1.2.0 makes a normal release; v1.2.0-rc.1 makes a pre-release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the tag is a version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag like v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: cargo test

      - name: Give the app the tag's version
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="$VERSION"

      - run: pnpm desktop:dist

      - name: Write checksums
        working-directory: desktop/release
        run: sha256sum *.AppImage *.deb > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: release

      # Running the workflow again replaces the files of the release it already made.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Pecten Studio ${TAG#v}" "${prerelease[@]}"
          fi
