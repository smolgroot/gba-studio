[package]
name = "sample"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Metroidvania skeleton built from a GBA-Studio project"
publish = false

[dependencies]
agb = "0.25.0"
gba_studio_rt = { path = "../runtime", features = ["agb"] }

[build-dependencies]
gba_studio_build = { path = "../codegen" }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
