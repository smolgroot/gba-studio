[package]
name = "sample"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Metroidvania skeleton built from a Pecten-Studio project"
publish = false

[features]
# Shows frame times in the corner instead of the score.
measure = []

[dependencies]
agb = "0.25.0"
agb_tracker = "0.25.0"
pecten_studio_rt = { path = "../runtime", features = ["agb"] }

[build-dependencies]
pecten_studio_build = { path = "../codegen" }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
